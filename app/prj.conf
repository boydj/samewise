# Every image: the whole application, the kernel clock with the supervisor
# work queue, the embedded SAME clip for audio, and stand-ins for the
# interfaces with no driver yet (tuner, alert_out, audio_out, battery, input).
CONFIG_PRINTK=y
CONFIG_THREAD_NAME=y
CONFIG_MAIN_STACK_SIZE=2048

CONFIG_WX_APP_LOGIC=y
CONFIG_WX_DRV_CLOCK=y
CONFIG_WX_AUDIO_CLIP=y
# 8-bit samples: half the flash, and plenty for clean AFSK.
CONFIG_WX_AUDIO_CLIP_BITS=8

CONFIG_WX_FAKE_ALERT_OUT=y
CONFIG_WX_FAKE_AUDIO_OUT=y
CONFIG_WX_FAKE_BATTERY=y
CONFIG_WX_FAKE_INPUT=y
CONFIG_WX_FAKE_TUNER=y
