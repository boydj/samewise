# XIAO nRF52840 (milestone 3.5): real watchdog, settings flash and
# Bluetooth; the rest on stand-ins until the radio board exists.
CONFIG_FPU=y

# Console on UART0 (see the overlay), not USB CDC ACM: no USB stack.
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Watchdog and the reset cause
CONFIG_WATCHDOG=y
CONFIG_HWINFO=y
CONFIG_WX_DRV_WATCHDOG=y

# Settings and alert log on NVS in the storage partition
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_WX_DRV_STORAGE=y

# Crypto in software (Oberon) and entropy from the RNG peripheral, not the
# CryptoCell: Renode has no CC310 model, and the milestone 3.5 image must be
# the one it runs. Revisit on hardware (milestone 4): CC310 is faster.
CONFIG_HW_CC3XX=n
CONFIG_ENTROPY_CC3XX=n

# Bluetooth settings service (spec: Bluetooth settings service)
CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="WX Radio"
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=2
CONFIG_BT_ATT_PREPARE_COUNT=6
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_WX_BLE_ZEPHYR=y

# Firmware updates: SMP over Bluetooth, authenticated links only
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW_AUTHEN=y
CONFIG_MCUMGR_GRP_OS=y

# Stack high-water marks after the clip benchmark (milestone 3.5)
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_PRINTK=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y
