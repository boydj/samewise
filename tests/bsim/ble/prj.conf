# One image plays the radio (device 0) and the phones (devices 1-3),
# chosen by -testid.
CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="WX Radio"
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_SMP=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=2
CONFIG_BT_ATT_PREPARE_COUNT=6
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_WX_BLE_ZEPHYR=y
# The phones report a security error instead of pairing on their own, so
# the test sees the refusal (an iPhone would start pairing here).
CONFIG_BT_ATT_RETRY_ON_SEC_ERR=n

# Firmware updates: SMP over Bluetooth, authenticated (LESC-only) links.
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW_AUTHEN=y
CONFIG_MCUMGR_GRP_OS=y

# The radio, on the native_sim fakes.
CONFIG_WX_APP_LOGIC=y
CONFIG_WX_FAKE_AUDIO_IN=y
CONFIG_WX_FAKE_ALERT_OUT=y
CONFIG_WX_FAKE_AUDIO_OUT=y
CONFIG_WX_FAKE_BATTERY=y
CONFIG_WX_FAKE_CLOCK=y
CONFIG_WX_FAKE_INPUT=y
CONFIG_WX_FAKE_STORAGE=y
CONFIG_WX_FAKE_TUNER=y
CONFIG_WX_FAKE_WATCHDOG=y

CONFIG_LOG=y
CONFIG_ASSERT=y
CONFIG_MAIN_STACK_SIZE=4096
