name: ci

on:
  push:
  pull_request:

jobs:
  native-sim:
    runs-on: ubuntu-24.04
    env:
      ZEPHYR_TOOLCHAIN_VARIANT: host
    steps:
      - uses: actions/checkout@v4
        with:
          path: samewise
          lfs: true

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-multilib g++-multilib device-tree-compiler ninja-build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache west modules
        uses: actions/cache@v4
        with:
          path: |
            nrf
            zephyr
            modules
            .west
          key: west-${{ hashFiles('samewise/west.yml') }}

      - name: West workspace
        run: |
          pip install west
          [ -d .west ] || west init -l samewise
          west update --narrow -o=--depth=1

      - name: Python requirements
        run: |
          pip install -r zephyr/scripts/requirements-base.txt \
                      -r zephyr/scripts/requirements-build-test.txt \
                      -r zephyr/scripts/requirements-run-test.txt \
                      -r samewise/tools/requirements.txt

      - name: Generator self-tests
        working-directory: samewise
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v

      - name: Twister (native_sim)
        working-directory: samewise
        run: west twister -T tests -p native_sim --inline-logs -v

      - name: Upload SNR report and twister output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twister-out
          path: |
            samewise/twister-out/twister.json
            samewise/twister-out/**/handler.log
            samewise/docs/decoder-snr.md
          if-no-files-found: ignore

  bsim:
    # Bluetooth on nrf52_bsim: the radio and three phones over Zephyr's host
    # and the SoftDevice Controller, in BabbleSim.
    runs-on: ubuntu-24.04
    env:
      ZEPHYR_TOOLCHAIN_VARIANT: host
    steps:
      - uses: actions/checkout@v4
        with:
          path: samewise

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-multilib g++-multilib device-tree-compiler ninja-build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache west modules
        uses: actions/cache@v4
        with:
          path: |
            nrf
            nrfxlib
            zephyr
            modules
            tools/bsim
            .west
          key: west-bsim-${{ hashFiles('samewise/west.yml') }}

      - name: West workspace
        run: |
          pip install west
          [ -d .west ] || west init -l samewise
          west update --narrow -o=--depth=1

      - name: Python requirements
        run: |
          pip install -r zephyr/scripts/requirements-base.txt \
                      -r zephyr/scripts/requirements-build-test.txt \
                      -r zephyr/scripts/requirements-run-test.txt

      - name: Build BabbleSim
        run: |
          [ -x tools/bsim/bin/bs_2G4_phy_v1 ] || make -C tools/bsim everything -j"$(nproc)"

      - name: Bluetooth tests (nrf52_bsim)
        working-directory: samewise
        run: |
          export ZEPHYR_BASE="$GITHUB_WORKSPACE/zephyr"
          export BSIM_OUT_PATH="$GITHUB_WORKSPACE/tools/bsim"
          export BSIM_COMPONENTS_PATH="$BSIM_OUT_PATH/components"
          tests/bsim/run.sh 2>&1 | tee bsim.log

      - name: Upload simulation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bsim-log
          path: samewise/bsim.log
          if-no-files-found: ignore

  swift:
    # The Swift packages: GattModel (checked against docs/gatt.json),
    # SamewiseKit (the app's logic, with CoreBluetooth on macOS) and the
    # iPhone app's stand-in for the radio, the mock peripheral.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: GattModel tests
        working-directory: swift/GattModel
        run: swift test

      - name: SamewiseKit tests
        working-directory: swift/SamewiseKit
        run: swift test

      - name: Build the mock peripheral
        working-directory: tools/mock-peripheral
        run: swift build

  ios:
    # The iPhone app (app milestone 1): generate the project with XcodeGen,
    # then build it and run its unit and UI tests on a simulator, where it
    # uses the fake radio.
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios/Samewise
    steps:
      - uses: actions/checkout@v4

      - name: XcodeGen
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          xcodebuild -version
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          ios = sorted((r for r in runtimes if "iOS" in r), reverse=True)
          print(next(d["udid"] for r in ios for d in runtimes[r] if d["name"].startswith("iPhone")))')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: >-
          xcodebuild test -project Samewise.xcodeproj -scheme Samewise
          -destination "id=${{ steps.sim.outputs.udid }}"
          -resultBundlePath "$RUNNER_TEMP/Samewise.xcresult"
          CODE_SIGNING_ALLOWED=NO -quiet

      - name: Test summary
        if: always()
        run: |
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/Samewise.xcresult" | tee summary.json
          python3 -c '
          import json
          s = json.load(open("summary.json"))
          print("| Result | Passed | Failed | Skipped |\n| --- | --- | --- | --- |")
          print("| {} | {} | {} | {} |".format(s["result"], s["passedTests"], s["failedTests"], s["skippedTests"]))
          for f in s.get("testFailures", []):
              print("\n**{}**\n\n```\n{}\n```".format(f["testName"], f["failureText"][:20000]))
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcresult
          path: ${{ runner.temp }}/Samewise.xcresult
          if-no-files-found: ignore

  xiao:
    # The XIAO nRF52840 image (milestone 3.5): size against the MCUboot
    # budget, then decode, CPU and stack checks in Renode.
    runs-on: ubuntu-24.04
    env:
      ZEPHYR_TOOLCHAIN_VARIANT: zephyr
      ZEPHYR_SDK_VERSION: "1.0.1"
    steps:
      - uses: actions/checkout@v4
        with:
          path: samewise

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-multilib g++-multilib device-tree-compiler ninja-build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache west modules
        uses: actions/cache@v4
        with:
          path: |
            nrf
            nrfxlib
            zephyr
            modules
            tools/bsim
            .west
          key: west-xiao-${{ hashFiles('samewise/west.yml') }}

      - name: West workspace
        run: |
          pip install west
          [ -d .west ] || west init -l samewise
          west update --narrow -o=--depth=1

      - name: Python requirements
        run: |
          pip install -r zephyr/scripts/requirements-base.txt \
                      -r zephyr/scripts/requirements-build-test.txt \
                      -r samewise/tools/requirements.txt

      - name: Cache Zephyr SDK
        uses: actions/cache@v4
        with:
          path: ~/zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}
          key: zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}-arm

      - name: Zephyr SDK (ARM toolchain)
        run: |
          sdk=~/zephyr-sdk-$ZEPHYR_SDK_VERSION
          if [ ! -x $sdk/gnu/arm-zephyr-eabi/bin/arm-zephyr-eabi-gcc ]; then
            url=https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v$ZEPHYR_SDK_VERSION
            curl -sSfL $url/zephyr-sdk-${ZEPHYR_SDK_VERSION}_linux-x86_64_minimal.tar.xz | tar xJ -C ~
            (cd $sdk && ./setup.sh -t arm-zephyr-eabi -h)
          fi
          (cd $sdk && ./setup.sh -c)
          echo "ZEPHYR_SDK_INSTALL_DIR=$sdk" >> $GITHUB_ENV

      - name: Build for xiao_ble
        working-directory: samewise
        run: west build -b xiao_ble/nrf52840 app -d build-xiao -p always

      - name: Size against the budget
        working-directory: samewise
        run: |
          python3 tools/size/size_report.py build-xiao/app/zephyr/zephyr.elf \
            --summary "$GITHUB_STEP_SUMMARY" --json build-xiao/size.json

      - name: Same app on native_sim (the decode reference)
        working-directory: samewise
        env:
          ZEPHYR_TOOLCHAIN_VARIANT: host
        run: |
          west build -b native_sim app -d build-native -p always
          build-native/app/zephyr/zephyr.exe --stop_at=3 | tee native.log

      - name: Renode
        env:
          RENODE_VERSION: "1.16.0"
        run: |
          curl -sSfL https://github.com/renode/renode/releases/download/v$RENODE_VERSION/renode-$RENODE_VERSION.linux-portable.tar.gz | tar xz
          mv renode_${RENODE_VERSION}_portable renode
          pip install -r renode/tests/requirements.txt

      - name: Decode, CPU and stacks in Renode
        working-directory: samewise
        run: |
          tests/renode/run.sh ../renode build-xiao renode-out native.log
          cat renode-out/xiao-bench.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload image and bench
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xiao-bench
          path: |
            samewise/build-xiao/app/zephyr/zephyr.elf
            samewise/build-xiao/app/zephyr/zephyr.hex
            samewise/build-xiao/size.json
            samewise/native.log
            samewise/renode-out
          if-no-files-found: ignore
